{% for item in results %}
<div class="result-card" style="background: white; border: 2px solid var(--navy-blue); padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 12px;">
    
    <div style="flex: 0 0 200px; border-right: 2px solid var(--sky-blue); padding-right: 15px;">
        <strong style="font-size: 1.1rem; color: var(--navy-blue); display: block;">{{ item.brand }}</strong>
        <span style="color: var(--cinnamoroll-blue); font-size: 0.8rem;">{{ item.domain }}</span>
    </div>

    <div style="flex: 0 0 130px; text-align: center;">
        <span style="font-weight: 800; font-size: 0.65rem; text-transform: uppercase; padding: 5px 10px; border-radius: 4px; border: 1.5px solid var(--navy-blue); display: inline-block;
            {% if item.consensus == 'Strong' %} background: var(--sky-blue); color: var(--navy-blue);
            {% elif item.consensus == 'Moderate' %} background: #fff9db; color: #947100; border-color: #fab005;
            {% else %} background: #fff0f0; color: #c92a2a; border-color: #ff8787; {% endif %}">
            {{ item.consensus }}
        </span>
    </div>

    <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: #f8fbff; padding: 10px; border-radius: 8px;">
        <div>
            <div style="display: flex; justify-content: space-between; font-size: 0.65rem; font-weight: 800; margin-bottom: 4px;">
                <span>CONFIDENCE</span><span>{{ item.confidence }}%</span>
            </div>
            <div style="width: 100%; background: #fff; height: 6px; border-radius: 10px; border: 1px solid var(--navy-blue); overflow: hidden;">
                <div style="width: {{ item.confidence }}%; background: var(--navy-blue); height: 100%;"></div>
            </div>
        </div>
        <div>
            <div style="display: flex; justify-content: space-between; font-size: 0.65rem; font-weight: 800; margin-bottom: 4px;">
                <span>STABILITY</span><span>{{ item.stability }}%</span>
            </div>
            <div style="width: 100%; background: #fff; height: 6px; border-radius: 10px; border: 1px solid var(--navy-blue); overflow: hidden;">
                <div style="width: {{ item.stability }}%; background: var(--sky-blue); height: 100%;"></div>
            </div>
        </div>
    </div>
</div>
{% endfor %}
