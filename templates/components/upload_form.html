<form action="/" method="POST" enctype="multipart/form-data" style="text-align: left;">

	<div style="margin-bottom: 20px;">
		<label style="font-weight: 700; margin-bottom: 8px; display: block; color: var(--cinnamoroll-blue);">
			☁️ Logo Image
		</label>
		<input type="file" name="file" required
			style="width: 100%; padding: 10px; background: white; border: 2px solid var(--sky-blue); border-radius: 12px; box-sizing: border-box;">
	</div>

	<div style="margin-bottom: 20px;">
		<label style="font-weight: 700; margin-bottom: 8px; display: block; color: var(--cinnamoroll-blue);">
			🌍 Database Scope
		</label>
		<select name="scope"
			style="width: 100%; padding: 12px; border: 2px solid var(--sky-blue); border-radius: 12px; background: white; color: var(--cinnamoroll-blue); cursor: pointer; appearance: none;">
			<option value="PH" {{ 'selected' if current_scope=='PH' }}>Philippines (PH)</option>
			<option value="GLOBAL" {{ 'selected' if current_scope=='GLOBAL' }}>Global Database</option>
			<option value="BOTH" {{ 'selected' if current_scope=='BOTH' or not current_scope }}>Both
				Databases</option>
		</select>
	</div>

	<div style="margin-bottom: 25px;">
		<label style="font-weight: 700; margin-bottom: 8px; display: block; color: var(--cinnamoroll-blue);">
			🔢 Results to Show (K)
		</label>
		<select name="top_k"
			style="width: 100%; padding: 12px; border: 2px solid var(--sky-blue); border-radius: 12px; background: white; color: var(--cinnamoroll-blue); cursor: pointer;">
			<option value="5" {{ 'selected' if current_k==5 or not current_k }}>Top 5 Results</option>
			<option value="10" {{ 'selected' if current_k==10 }}>Top 10 Results</option>
			<option value="25" {{ 'selected' if current_k==25 }}>Top 25 Results</option>
		</select>
	</div>

	<button type="submit" class="btn-primary"
		style="width: 100%; font-size: 1rem; box-shadow: 0 4px 10px rgba(185, 233, 255, 0.5);">
		✨ Run Deep Scan
	</button>
</form>
