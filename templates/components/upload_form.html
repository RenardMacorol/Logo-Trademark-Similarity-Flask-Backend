<script>
	// 1. Dito nakalagay yung function na gumagawa ng mabigat na trabaho
	async function updateDashboard(event) {
		if (event) event.preventDefault();

		const form = document.getElementById('search-form');
		const formData = new FormData(form);
		const resultsContainer = document.querySelector('.results-list');

		resultsContainer.style.opacity = '0.5';

		try {
			const response = await fetch('/filter-results', {
				method: 'POST',
				body: formData
			});
			const data = await response.json();
			resultsContainer.innerHTML = data.html;

			if (document.getElementById('total-matches')) {
				document.getElementById('total-matches').innerText = `${data.total_found} Brands Scanned`;
			}
		} catch (error) {
			console.error("Dashboard Sync Failed:", error);
		} finally {
			resultsContainer.style.opacity = '1';
		}
	}

	// 2. Dito natin ilalagay yung listener na tinatanong mo
	// Sinisiguro nito na "nakikinig" na ang browser sa clicks mo pagka-load na pagka-load ng page
	document.addEventListener('DOMContentLoaded', () => {
		const triggers = document.querySelectorAll('select, input[type="checkbox"]');

		triggers.forEach(el => {
			el.addEventListener('change', () => {
				console.log("⚡ Change detected, updating dashboard...");
				updateDashboard();
			});
		});
	});
</script>
