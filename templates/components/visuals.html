<div
	style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; box-sizing: border-box; margin-bottom: 25px;">

	<div
		style="background: #ffffff; border: 4px solid var(--navy-blue); border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative;">
		<h4
			style="margin: 0 0 15px 0; font-size: 0.75rem; color: var(--navy-blue); letter-spacing: 2px; font-weight: 900; text-transform: uppercase; border-bottom: 2px solid var(--sky-blue); display: inline-block; padding-bottom: 4px;">
			Neural Heatmap
		</h4>
		<div
			style="height: 260px; width: 100%; display: flex; align-items: center; justify-content: center; background: #fcfcfc; border-radius: 8px;">
			<img src="{{ mask_img }}"
				style="max-height: 100%; max-width: 100%; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));">
		</div>
	</div>

	<div
		style="background: #ffffff; border: 4px solid var(--navy-blue); border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative;">
		<h4
			style="margin: 0 0 15px 0; font-size: 0.75rem; color: var(--navy-blue); letter-spacing: 2px; font-weight: 900; text-transform: uppercase; border-bottom: 2px solid var(--sky-blue); display: inline-block; padding-bottom: 4px;">
			Isolated Input
		</h4>
		<div
			style="height: 260px; width: 100%; display: flex; align-items: center; justify-content: center; background: #fcfcfc; border-radius: 8px;">
			<img src="{{ original_img }}"
				style="max-height: 100%; max-width: 100%; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));">
		</div>
	</div>

</div>
