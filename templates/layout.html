<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}WonksNet AI{% endblock %}</title>
	<style>
		:root {
			--primary-blue: #007bff;
			--dark-blue: #0056b3;
			--light-bg: #f0f4f8;
			--card-bg: #ffffff;
			--success-green: #28a745;
		}

		body {
			font-family: 'Segoe UI', sans-serif;
			background-color: var(--light-bg);
			margin: 0;
			padding: 40px;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.container {
			max-width: 900px;
			width: 100%;
			background: var(--card-bg);
			padding: 40px;
			border-radius: 20px;
			box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
			text-align: center;
		}

		/* Global Blue Button Styling */
		.btn-primary {
			background-color: var(--primary-blue);
			color: white;
			border: none;
			padding: 15px 40px;
			border-radius: 10px;
			cursor: pointer;
			font-weight: 600;
		}
	</style>
	{% block extra_css %}{% endblock %}
</head>

<body>
	<div class="container">
		<h1>WonksNet AI</h1>
		{% block content %}{% endblock %}
	</div>
</body>

</html>
