<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WonksNet AI | Command Center</title>
    <style>
        :root {
            --sky-blue: #B9E9FF;         
            --navy-blue: #002D57;        
            --cinnamoroll-blue: #5B8FB9;   
            --cloud-white: #ffffff;
            --deep-bg: #1a1a1a; /* Darker background for tech feel */
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            /* High-contrast gradient */
            background: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
            margin: 0;
            padding: 15px; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden; 
            color: var(--navy-blue);
        }

        .container {
            width: 98vw; /* Maximize screen occupancy */
            max-width: 1800px;
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            /* Sharper corners for professional look */
            border-radius: 12px; 
            border: 4px solid var(--navy-blue);
            box-sizing: border-box;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            border-bottom: 3px solid var(--navy-blue); 
            padding-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .status-badge {
            background: var(--navy-blue);
            color: var(--sky-blue);
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Responsive fixes */
        @media (max-width: 1200px) {
            .container { width: 100vw; border-radius: 0; border: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>WonksNet <span style="color: var(--cinnamoroll-blue);">AI Engine</span></h1>
            <div class="status-badge">CORE STATUS: ACTIVE</div>
        </header>
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
